<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exam Capture — Viewer</title>
<style>
  :root {
    --accent: #185fa5; --bg: #f1efe8; --card: #ffffff; --border: #d3d1c7;
    --text: #2c2c2a; --muted: #5f5e5a; --success: #3b6d11;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); margin: 0; padding: 24px;
    max-width: 900px; margin: 0 auto;
  }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.sub { color: var(--muted); font-size: 14px; margin: 0 0 24px; }
  .row { display: flex; gap: 20px; flex-wrap: wrap; }
  .panel {
    flex: 1; min-width: 320px; background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 20px;
  }
  .panel h2 { font-size: 15px; margin: 0 0 12px; color: var(--accent); }
  .panel.score h2 { color: var(--success); }
  img.capture {
    width: 100%; max-height: 160px; object-fit: contain; background: #fafafa;
    border: 1px solid var(--border); border-radius: 8px; margin-bottom: 14px; display: block;
  }
  .field-row { display: flex; gap: 10px; }
  input[type="text"] {
    flex: 1; padding: 12px; font-size: 18px; border: 1px solid var(--border); border-radius: 8px;
  }
  button {
    padding: 12px 18px; border: none; border-radius: 8px; background: var(--accent);
    color: white; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .panel.score button { background: var(--success); }
  .meta { margin-top: 24px; font-size: 13px; color: var(--muted); }
  .settings { margin-top: 30px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .settings label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .settings input { width: 100%; max-width: 500px; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; margin-bottom: 8px; }
  .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #ccc; margin-right: 6px; }
  .status-dot.live { background: var(--success); }
</style>
</head>
<body>

  <h1>Exam Capture — Viewer</h1>
  <p class="sub"><span class="status-dot" id="statusDot"></span><span id="statusText">Waiting for a scan from the phone...</span></p>

  <div class="row">
    <div class="panel index">
      <h2>Index number (first image)</h2>
      <img id="indexImg" class="capture" alt="Index number crop will appear here">
      <div class="field-row">
        <input type="text" id="indexText" readonly>
        <button onclick="copyField('indexText')">Copy</button>
      </div>
    </div>
    <div class="panel score">
      <h2>Score (second image)</h2>
      <img id="scoreImg" class="capture" alt="Score crop will appear here">
      <div class="field-row">
        <input type="text" id="scoreText" readonly>
        <button onclick="copyField('scoreText')">Copy</button>
      </div>
    </div>
  </div>

  <p class="meta" id="metaText"></p>

  <div class="settings">
    <label for="scriptUrl">Google Apps Script web app URL (same one used on the phone)</label>
    <input type="text" id="scriptUrl" placeholder="https://script.google.com/macros/s/.../exec">
    <button onclick="saveSettings()">Save & start watching</button>
  </div>

<script>
const S = { get: k => localStorage.getItem(k) || '', set: (k, v) => localStorage.setItem(k, v) };
document.getElementById('scriptUrl').value = S.get('sheet_url');

function saveSettings() {
  S.set('sheet_url', document.getElementById('scriptUrl').value.trim());
  restartPolling();
}

async function copyField(id) {
  const input = document.getElementById(id);
  try { await navigator.clipboard.writeText(input.value); }
  catch (err) { input.select(); document.execCommand('copy'); }
}

let pollHandle = null;
let lastTimestamp = null;
let jsonpCounter = 0;

function fetchLiveJSONP(url) {
  return new Promise((resolve, reject) => {
    const cbName = 'liveCb' + (jsonpCounter++);
    const script = document.createElement('script');
    const timeout = setTimeout(() => { cleanup(); reject(new Error('timeout')); }, 8000);
    function cleanup() {
      clearTimeout(timeout);
      delete window[cbName];
      script.remove();
    }
    window[cbName] = (data) => { cleanup(); resolve(data); };
    script.onerror = () => { cleanup(); reject(new Error('network error')); };
    script.src = url + (url.includes('?') ? '&' : '?') + 'action=live&callback=' + cbName;
    document.body.appendChild(script);
  });
}

async function poll() {
  const scriptUrl = S.get('sheet_url');
  if (!scriptUrl) return;
  try {
    const data = await fetchLiveJSONP(scriptUrl);
    if (data && data.timestamp && data.timestamp !== lastTimestamp) {
      lastTimestamp = data.timestamp;
      document.getElementById('indexImg').src = data.indexImage || '';
      document.getElementById('scoreImg').src = data.scoreImage || '';
      document.getElementById('indexText').value = data.indexText || '';
      document.getElementById('scoreText').value = data.scoreText || '';
      document.getElementById('metaText').textContent =
        `Confidence: ${data.confidence || '—'}  •  Captured: ${new Date(data.timestamp).toLocaleTimeString()}`;
    }
    setStatus(true);
  } catch (err) {
    setStatus(false);
  }
}

function setStatus(live) {
  document.getElementById('statusDot').classList.toggle('live', live);
  document.getElementById('statusText').textContent = live
    ? 'Connected — watching for scans'
    : 'Not connected — check the Apps Script URL below';
}

function restartPolling() {
  if (pollHandle) clearInterval(pollHandle);
  lastTimestamp = null;
  poll();
  pollHandle = setInterval(poll, 1500);
}

restartPolling();
</script>
</body>
</html>
