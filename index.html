<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exam Mark Capture (Auto-scan)</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
  :root {
    --accent: #185fa5; --bg: #f1efe8; --card: #ffffff; --border: #d3d1c7;
    --text: #2c2c2a; --muted: #5f5e5a; --danger: #a32d2d; --success: #3b6d11;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); margin: 0; padding: 16px;
    max-width: 480px; margin: 0 auto;
  }
  h1 { font-size: 18px; font-weight: 600; margin: 8px 0 4px; }
  p.sub { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .badge { display: inline-block; background: #e4efe0; color: var(--success); font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 12px; margin-bottom: 12px; }
  .badge.scan { background: #dbe8f5; color: var(--accent); }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  input[type="text"], input[type="number"] { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; margin-bottom: 12px; }
  button.secondary { width: 100%; padding: 12px; background: transparent; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; cursor: pointer; color: var(--text); margin-top: 8px; }
  button.save { width: 100%; padding: 14px; background: var(--success); color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 8px; }
  button.start { width: 100%; padding: 16px; background: var(--accent); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .video-wrap { position: relative; width: 100%; border-radius: 10px; overflow: hidden; background: #000; }
  video, #freezeCanvas { width: 100%; display: block; }
  #freezeCanvas { position: absolute; top: 0; left: 0; }
  .guide { position: absolute; border: 2px dashed rgba(255,255,255,0.85); pointer-events: none; border-radius: 4px; }
  .guide.armed { border-color: #3ddc63; }
  .guide-label { position: absolute; top: -20px; left: 0; font-size: 11px; color: white; background: rgba(0,0,0,0.55); padding: 2px 6px; border-radius: 4px; }
  .scan-status { text-align: center; font-size: 13px; color: white; background: rgba(0,0,0,0.55); position: absolute; bottom: 8px; left: 8px; right: 8px; padding: 8px; border-radius: 8px; }
  .status { font-size: 13px; margin: 8px 0; min-height: 18px; }
  .status.error { color: var(--danger); }
  .status.ok { color: var(--success); }
  .flag { background: #faeeda; color: #854f0b; font-size: 12px; padding: 6px 10px; border-radius: 6px; margin-bottom: 10px; }
  details summary { cursor: pointer; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .log { font-size: 12px; color: var(--muted); }
  .log-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--border); }
  .hidden { display: none; }
</style>
</head>
<body>

  <h1>Exam mark capture — auto-scan</h1>
  <p class="sub">Hold the booklet steady inside the guide. It captures and reads automatically.</p>

  <!-- LIVE SCAN VIEW -->
  <div class="card" id="scanCard">
    <div class="badge scan">Live scanning</div>
    <button class="start" id="startBtn" onclick="startScanning()">▶ Start scanning</button>
    <div class="video-wrap hidden" id="videoWrap">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="freezeCanvas" class="hidden"></canvas>
      <div class="guide" id="indexGuide"><span class="guide-label">Index number</span></div>
      <div class="guide" id="scoreGuide"><span class="guide-label">Score</span></div>
      <div class="scan-status" id="scanStatus">Point camera at booklet cover...</div>
    </div>
    <button class="secondary hidden" id="stopBtn" onclick="stopScanning()">Stop scanning</button>
  </div>

  <!-- RESULTS -->
  <div class="card hidden" id="resultCard">
    <div class="badge">Verify before saving</div>
    <div id="confidenceFlag"></div>
    <label for="indexNumber">Index number</label>
    <input type="text" id="indexNumber" placeholder="e.g. 1234/2026">
    <label for="score">Score</label>
    <input type="number" id="score">
    <label style="margin-top:4px;">Confidence: <span id="confidenceText" style="color:var(--text);font-weight:600;"></span></label>
    <button class="save" id="saveBtn" onclick="saveToSheet()">Save & scan next</button>
    <button class="secondary" onclick="discardAndRescan()">Discard, rescan this one</button>
    <div id="saveStatus" class="status"></div>
  </div>

  <details>
    <summary>Settings</summary>
    <div class="card">
      <label for="scriptUrl">Google Apps Script web app URL</label>
      <input type="text" id="scriptUrl" placeholder="https://script.google.com/macros/s/.../exec">
      <button class="secondary" onclick="saveSettings()">Save settings</button>
      <div id="settingsStatus" class="status"></div>
    </div>
  </details>

  <div class="card">
    <label>Recent submissions (this device)</label>
    <div class="log" id="log">No submissions yet.</div>
  </div>

<script>
const S = { get: k => localStorage.getItem(k) || '', set: (k, v) => localStorage.setItem(k, v) };
document.getElementById('scriptUrl').value = S.get('sheet_url');
function saveSettings() {
  S.set('sheet_url', document.getElementById('scriptUrl').value.trim());
  const el = document.getElementById('settingsStatus');
  el.textContent = 'Settings saved.'; el.className = 'status ok';
}

// ---- Fixed guide layout (matches the printed booklet cover template) ----
// Percent coordinates: left, top, right, bottom, digit count
const GUIDE = {
  index: { left: 10, top: 18, right: 55, bottom: 28, digits: 6 },
  score: { left: 10, top: 38, right: 35, bottom: 48, digits: 3 },
};

let stream = null;
let video, freezeCanvas;
let loopHandle = null;
let stableCount = 0;
let armed = true;           // only allow capture when armed (prevents recapturing same still page)
let lastFrameData = null;
const STABLE_FRAMES_NEEDED = 4;   // ~4 x 250ms ≈ 1s held steady
const DIFF_THRESHOLD = 12;        // motion sensitivity
const CHANGE_THRESHOLD = 30;      // "page swapped" sensitivity to re-arm
const SAMPLE_MS = 250;

function positionGuides() {
  const wrap = document.getElementById('videoWrap');
  const w = wrap.clientWidth, h = wrap.clientHeight;
  const idx = document.getElementById('indexGuide');
  idx.style.left = (GUIDE.index.left/100*w) + 'px';
  idx.style.top = (GUIDE.index.top/100*h) + 'px';
  idx.style.width = ((GUIDE.index.right-GUIDE.index.left)/100*w) + 'px';
  idx.style.height = ((GUIDE.index.bottom-GUIDE.index.top)/100*h) + 'px';
  const sc = document.getElementById('scoreGuide');
  sc.style.left = (GUIDE.score.left/100*w) + 'px';
  sc.style.top = (GUIDE.score.top/100*h) + 'px';
  sc.style.width = ((GUIDE.score.right-GUIDE.score.left)/100*w) + 'px';
  sc.style.height = ((GUIDE.score.bottom-GUIDE.score.top)/100*h) + 'px';
}

async function startScanning() {
  document.getElementById('startBtn').classList.add('hidden');
  document.getElementById('videoWrap').classList.remove('hidden');
  document.getElementById('stopBtn').classList.remove('hidden');
  document.getElementById('resultCard').classList.add('hidden');

  video = document.getElementById('video');
  freezeCanvas = document.getElementById('freezeCanvas');

  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    video.srcObject = stream;
    await video.play();
    positionGuides();
    window.addEventListener('resize', positionGuides);
    armed = true;
    stableCount = 0;
    lastFrameData = null;
    setScanStatus('Point camera at booklet cover...', false);
    loopHandle = setInterval(analyzeFrame, SAMPLE_MS);
  } catch (err) {
    setScanStatus('Camera access failed: ' + err.message, false);
  }
}

function stopScanning() {
  if (loopHandle) clearInterval(loopHandle);
  if (stream) stream.getTracks().forEach(t => t.stop());
  document.getElementById('startBtn').classList.remove('hidden');
  document.getElementById('videoWrap').classList.add('hidden');
  document.getElementById('stopBtn').classList.add('hidden');
}

function setScanStatus(text, isArmedVisual) {
  document.getElementById('scanStatus').textContent = text;
  document.getElementById('indexGuide').classList.toggle('armed', isArmedVisual);
  document.getElementById('scoreGuide').classList.toggle('armed', isArmedVisual);
}

// small offscreen canvas for cheap motion analysis
const sampleCanvas = document.createElement('canvas');
sampleCanvas.width = 120; sampleCanvas.height = 90;
const sampleCtx = sampleCanvas.getContext('2d');

function analyzeFrame() {
  if (!video || video.readyState < 2) return;
  sampleCtx.drawImage(video, 0, 0, sampleCanvas.width, sampleCanvas.height);
  const frame = sampleCtx.getImageData(0, 0, sampleCanvas.width, sampleCanvas.height).data;

  if (lastFrameData) {
    let diffSum = 0;
    for (let i = 0; i < frame.length; i += 4) {
      diffSum += Math.abs(frame[i] - lastFrameData[i]);
    }
    const avgDiff = diffSum / (frame.length / 4);

    if (!armed) {
      // waiting for the booklet to be swapped/removed before re-arming
      if (avgDiff > CHANGE_THRESHOLD) {
        armed = true;
        stableCount = 0;
        setScanStatus('Ready — hold next booklet steady...', false);
      }
    } else if (avgDiff < DIFF_THRESHOLD) {
      stableCount++;
      setScanStatus(`Holding steady... (${stableCount}/${STABLE_FRAMES_NEEDED})`, true);
      if (stableCount >= STABLE_FRAMES_NEEDED) {
        captureAndRead();
      }
    } else {
      stableCount = 0;
      setScanStatus('Point camera at booklet cover...', false);
    }
  }
  lastFrameData = frame;
}

async function captureAndRead() {
  armed = false;
  stableCount = 0;
  clearInterval(loopHandle);
  setScanStatus('Captured — reading...', false);

  // freeze the current frame at full resolution
  freezeCanvas.width = video.videoWidth;
  freezeCanvas.height = video.videoHeight;
  const ctx = freezeCanvas.getContext('2d');
  ctx.drawImage(video, 0, 0);
  freezeCanvas.classList.remove('hidden');

  const fullImg = new Image();
  fullImg.onload = async () => {
    await readAndShow(fullImg);
    loopHandle = setInterval(analyzeFrame, SAMPLE_MS); // resume watching for next booklet swap
  };
  fullImg.src = freezeCanvas.toDataURL('image/png');
}

function cropRegion(img, g) {
  const canvas = document.createElement('canvas');
  const sx = g.left/100 * img.naturalWidth;
  const sy = g.top/100 * img.naturalHeight;
  const sw = (g.right-g.left)/100 * img.naturalWidth;
  const sh = (g.bottom-g.top)/100 * img.naturalHeight;
  canvas.width = sw; canvas.height = sh;
  canvas.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, sw, sh);
  return canvas;
}
function preprocess(canvas) {
  const ctx = canvas.getContext('2d');
  const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const d = imgData.data;
  for (let i = 0; i < d.length; i += 4) {
    const gray = 0.3*d[i] + 0.59*d[i+1] + 0.11*d[i+2];
    const v = gray < 150 ? 0 : 255;
    d[i] = d[i+1] = d[i+2] = v;
  }
  ctx.putImageData(imgData, 0, 0);
  return canvas;
}

let workerPromise = null;
async function getWorker() {
  if (!workerPromise) {
    workerPromise = (async () => {
      const worker = await Tesseract.createWorker('eng');
      await worker.setParameters({ tessedit_char_whitelist: '0123456789' });
      return worker;
    })();
  }
  return workerPromise;
}
async function ocrDigitBox(canvas) {
  const worker = await getWorker();
  const { data } = await worker.recognize(canvas);
  const text = (data.text || '').replace(/\D/g, '');
  return { text: text.length ? text[0] : '', confidence: data.confidence || 0 };
}
async function readRow(g) {
  const results = [];
  const width = g.right - g.left;
  for (let i = 0; i < g.digits; i++) {
    const boxLeft = g.left + (width/g.digits)*i;
    const boxRight = g.left + (width/g.digits)*(i+1);
    let canvas = cropRegion({ naturalWidth: freezeCanvas.width, naturalHeight: freezeCanvas.height, __src: null }, { left: boxLeft, top: g.top, right: boxRight, bottom: g.bottom });
    // draw directly from freezeCanvas for full-res crop
    const ctx = canvas.getContext('2d');
    const sx = boxLeft/100 * freezeCanvas.width, sy = g.top/100 * freezeCanvas.height;
    const sw = (boxRight-boxLeft)/100 * freezeCanvas.width, sh = (g.bottom-g.top)/100 * freezeCanvas.height;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(freezeCanvas, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
    preprocess(canvas);
    results.push(await ocrDigitBox(canvas));
  }
  return results;
}

let lastReading = null;

async function readAndShow() {
  try {
    const indexDigits = await readRow(GUIDE.index);
    const scoreDigits = await readRow(GUIDE.score);

    const indexNumber = indexDigits.map(d => d.text || '?').join('');
    const score = scoreDigits.map(d => d.text || '?').join('');
    const allConf = [...indexDigits, ...scoreDigits].map(d => d.confidence);
    const avgConf = allConf.reduce((a,b) => a+b, 0) / (allConf.length || 1);

    let confLabel;
    if (avgConf >= 85 && !indexNumber.includes('?') && !score.includes('?')) confLabel = `High (${avgConf.toFixed(0)}%)`;
    else if (avgConf >= 65) confLabel = `Medium (${avgConf.toFixed(0)}%)`;
    else confLabel = `Low (${avgConf.toFixed(0)}%)`;

    lastReading = { indexNumber, score, confLabel };

    document.getElementById('indexNumber').value = indexNumber.includes('?') ? '' : indexNumber;
    document.getElementById('score').value = score.includes('?') ? '' : score;
    document.getElementById('confidenceText').textContent = confLabel;

    const flagEl = document.getElementById('confidenceFlag');
    flagEl.innerHTML = confLabel.startsWith('Low') || indexNumber.includes('?') || score.includes('?')
      ? '<div class="flag">⚠ Low confidence — please check carefully against the booklet before saving.</div>'
      : '';

    document.getElementById('resultCard').classList.remove('hidden');
    setScanStatus('Ready — hold next booklet steady...', false);
  } catch (err) {
    setScanStatus('Reading failed: ' + err.message, false);
  }
}

function discardAndRescan() {
  document.getElementById('resultCard').classList.add('hidden');
  freezeCanvas.classList.add('hidden');
  armed = true;
}

async function saveToSheet() {
  const scriptUrl = S.get('sheet_url');
  const indexNumber = document.getElementById('indexNumber').value.trim();
  const score = document.getElementById('score').value.trim();
  const confidence = lastReading ? lastReading.confLabel : '';
  const statusEl = document.getElementById('saveStatus');

  if (!indexNumber || !score) { statusEl.textContent = 'Enter both index number and score first.'; statusEl.className = 'status error'; return; }
  if (!scriptUrl) { statusEl.textContent = 'Google Sheet connection not set (see Settings).'; statusEl.className = 'status error'; return; }

  const saveBtn = document.getElementById('saveBtn');
  saveBtn.disabled = true;
  statusEl.textContent = 'Saving...'; statusEl.className = 'status';

  try {
    await fetch(scriptUrl, {
      method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ indexNumber, score, confidence, timestamp: new Date().toISOString() })
    });
    statusEl.textContent = 'Saved.'; statusEl.className = 'status ok';
    addToLog(indexNumber, score, confidence);
    document.getElementById('resultCard').classList.add('hidden');
    freezeCanvas.classList.add('hidden');
  } catch (err) {
    statusEl.textContent = 'Save failed: ' + err.message; statusEl.className = 'status error';
  } finally {
    saveBtn.disabled = false;
  }
}

function addToLog(indexNumber, score, confidence) {
  const logs = JSON.parse(localStorage.getItem('submission_log') || '[]');
  logs.unshift({ indexNumber, score, confidence, time: new Date().toLocaleTimeString() });
  localStorage.setItem('submission_log', JSON.stringify(logs.slice(0, 20)));
  renderLog();
}
function renderLog() {
  const logs = JSON.parse(localStorage.getItem('submission_log') || '[]');
  const el = document.getElementById('log');
  if (logs.length === 0) { el.textContent = 'No submissions yet.'; return; }
  el.innerHTML = logs.map(l => `<div class="log-row"><span>#${l.indexNumber} — ${l.score} (${l.confidence})</span><span>${l.time}</span></div>`).join('');
}
renderLog();
</script>
</body>
</html>
