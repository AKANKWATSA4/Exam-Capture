<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exam Mark Capture</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
  :root {
    --accent: #185fa5; --bg: #f1efe8; --card: #ffffff; --border: #d3d1c7;
    --text: #2c2c2a; --muted: #5f5e5a; --danger: #a32d2d; --success: #3b6d11;
  }
  * { box-sizing: border-box; }
  html {
    overflow-y: scroll; /* always reserve space so the scrollbar is persistently visible */
    scrollbar-gutter: stable;
    scrollbar-width: auto; /* Firefox */
    scrollbar-color: var(--accent) var(--border); /* Firefox */
  }
  html::-webkit-scrollbar { width: 12px; }
  html::-webkit-scrollbar-track { background: var(--border); }
  html::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 6px; border: 2px solid var(--border); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); margin: 0; padding: 16px;
    max-width: 480px; margin: 0 auto;
  }
  h1 { font-size: 18px; font-weight: 600; margin: 8px 0 4px; }
  p.sub { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .badge { display: inline-block; background: #e4efe0; color: var(--success); font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 12px; margin-bottom: 12px; }
  .badge.scan { background: #dbe8f5; color: var(--accent); }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  input[type="text"], input[type="number"] { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; margin-bottom: 12px; }
  button.secondary { width: 100%; padding: 12px; background: transparent; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; cursor: pointer; color: var(--text); margin-top: 8px; }
  button.save { width: 100%; padding: 14px; background: var(--success); color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 8px; }
  button.start { width: 100%; padding: 16px; background: var(--accent); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .video-wrap { position: relative; width: 100%; max-height: 45vh; border-radius: 10px; overflow: hidden; background: #000; }
  video, #freezeCanvas { width: 100%; height: 100%; display: block; object-fit: cover; }
  #freezeCanvas { position: absolute; top: 0; left: 0; }
  .scan-status { text-align: center; font-size: 13px; color: white; background: rgba(0,0,0,0.55); position: absolute; bottom: 8px; left: 8px; right: 8px; padding: 8px; border-radius: 8px; }
  .status { font-size: 13px; margin: 8px 0; min-height: 18px; }
  .status.error { color: var(--danger); }
  .status.ok { color: var(--success); }
  .flag { background: #faeeda; color: #854f0b; font-size: 12px; padding: 6px 10px; border-radius: 6px; margin-bottom: 10px; }
  details summary { cursor: pointer; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .log { font-size: 12px; color: var(--muted); }
  .log-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--border); }
  .hidden { display: none; }
  .detected-crop { display: block; max-width: 100%; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 8px; background: #fff; }
  .crop-label { font-size: 11px; color: var(--muted); margin: 4px 0 2px; }

  /* Draggable/resizable crop-frame overlays on the live camera view.
     touch-action: none is scoped to these elements only, so page scroll
     is untouched everywhere else. */
  .crop-box {
    position: absolute;
    border: 3px solid var(--frame-color);
    background: color-mix(in srgb, var(--frame-color) 12%, transparent);
    box-sizing: border-box;
    touch-action: none;
    cursor: move;
    border-radius: 4px;
  }
  .crop-box .crop-frame-tag {
    position: absolute; top: -22px; left: -3px;
    font-size: 11px; font-weight: 600; color: #fff;
    background: var(--frame-color); padding: 2px 7px; border-radius: 4px;
    white-space: nowrap; pointer-events: none;
  }
  .crop-box .resize-handle {
    position: absolute; right: -11px; bottom: -11px;
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--frame-color); border: 3px solid #fff;
    touch-action: none; cursor: nwse-resize;
  }
  #indexBox { --frame-color: #e8720c; left: 8%; top: 6%; width: 84%; height: 16%; }
  #scoreBox { --frame-color: #2f9e44; left: 8%; top: 30%; width: 46%; height: 16%; }
  button.capture { width: 100%; padding: 16px; background: var(--accent); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px; }
</style>
</head>
<body>

  <h1>Exam mark capture</h1>
  <p class="sub">Line the orange box up on the index number and the green box on the score, then tap Capture.</p>

  <div class="card" id="scanCard">
    <div class="badge scan">Live camera</div>
    <button class="start" id="startBtn" onclick="startScanning()">▶ Start scanning</button>
    <div class="video-wrap hidden" id="videoWrap">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="freezeCanvas" class="hidden"></canvas>
      <div class="crop-box" id="indexBox">
        <div class="crop-frame-tag">Index #</div>
        <div class="resize-handle"></div>
      </div>
      <div class="crop-box" id="scoreBox">
        <div class="crop-frame-tag">Score</div>
        <div class="resize-handle"></div>
      </div>
      <div class="scan-status" id="scanStatus">Position the boxes, then tap Capture.</div>
    </div>
    <button class="capture hidden" id="captureBtn" onclick="captureCropped()">📷 Capture & Crop</button>
    <button class="secondary hidden" id="stopBtn" onclick="stopScanning()">Stop scanning</button>
  </div>

  <div class="card hidden" id="resultCard">
    <div class="badge">Verify before saving</div>
    <div id="confidenceFlag"></div>

    <div class="crop-label">Detected as index number:</div>
    <canvas id="indexCropView" class="detected-crop"></canvas>
    <label for="indexNumber">Index number</label>
    <input type="text" id="indexNumber" placeholder="e.g. 1234/2026">

    <div class="crop-label">Detected as score:</div>
    <canvas id="scoreCropView" class="detected-crop"></canvas>
    <label for="score">Score</label>
    <input type="text" inputmode="numeric" id="score">

    <label style="margin-top:4px;">Confidence: <span id="confidenceText" style="color:var(--text);font-weight:600;"></span></label>
    <button class="save" id="saveBtn" onclick="saveToSheet()">Save & scan next</button>
    <button class="secondary" onclick="discardAndRescan()">Discard, rescan this one</button>
    <div id="saveStatus" class="status"></div>
  </div>

  <details>
    <summary>Settings</summary>
    <div class="card">
      <label for="scriptUrl">Google Apps Script web app URL</label>
      <input type="text" id="scriptUrl" placeholder="https://script.google.com/macros/s/.../exec">
      <button class="secondary" onclick="saveSettings()">Save settings</button>
      <div id="settingsStatus" class="status"></div>
    </div>
  </details>

  <div class="card">
    <label>Recent submissions (this device)</label>
    <div class="log" id="log">No submissions yet.</div>
  </div>

<script>
const S = { get: k => localStorage.getItem(k) || '', set: (k, v) => localStorage.setItem(k, v) };
document.getElementById('scriptUrl').value = S.get('sheet_url');
function saveSettings() {
  S.set('sheet_url', document.getElementById('scriptUrl').value.trim());
  const el = document.getElementById('settingsStatus');
  el.textContent = 'Settings saved.'; el.className = 'status ok';
}

let stream = null;
let video, freezeCanvas;

async function startScanning() {
  document.getElementById('startBtn').classList.add('hidden');
  document.getElementById('videoWrap').classList.remove('hidden');
  document.getElementById('captureBtn').classList.remove('hidden');
  document.getElementById('stopBtn').classList.remove('hidden');
  document.getElementById('resultCard').classList.add('hidden');

  video = document.getElementById('video');
  freezeCanvas = document.getElementById('freezeCanvas');

  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    video.srcObject = stream;
    await video.play();
    setScanStatus('Position the boxes, then tap Capture.');
  } catch (err) {
    setScanStatus('Camera access failed: ' + err.message);
  }
}

function stopScanning() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  document.getElementById('startBtn').classList.remove('hidden');
  document.getElementById('videoWrap').classList.add('hidden');
  document.getElementById('captureBtn').classList.add('hidden');
  document.getElementById('stopBtn').classList.add('hidden');
}

function setScanStatus(text) {
  document.getElementById('scanStatus').textContent = text;
}

// ---- Draggable / resizable crop-frame overlays ----
// touch-action: none lives only on .crop-box / .resize-handle (see CSS), so
// dragging these never blocks scrolling anywhere else on the page.
function makeDraggable(boxEl) {
  let dragging = false, startX, startY, startLeft, startTop;
  const wrapEl = document.getElementById('videoWrap');

  boxEl.addEventListener('pointerdown', (e) => {
    if (e.target.classList.contains('resize-handle')) return;
    dragging = true;
    boxEl.setPointerCapture(e.pointerId);
    const wrapRect = wrapEl.getBoundingClientRect();
    const boxRect = boxEl.getBoundingClientRect();
    startX = e.clientX; startY = e.clientY;
    startLeft = boxRect.left - wrapRect.left;
    startTop = boxRect.top - wrapRect.top;
  });
  boxEl.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const wrapRect = wrapEl.getBoundingClientRect();
    const boxRect = boxEl.getBoundingClientRect();
    let newLeft = startLeft + (e.clientX - startX);
    let newTop = startTop + (e.clientY - startY);
    newLeft = Math.max(0, Math.min(newLeft, wrapRect.width - boxRect.width));
    newTop = Math.max(0, Math.min(newTop, wrapRect.height - boxRect.height));
    boxEl.style.left = newLeft + 'px';
    boxEl.style.top = newTop + 'px';
  });
  boxEl.addEventListener('pointerup', () => { dragging = false; });
  boxEl.addEventListener('pointercancel', () => { dragging = false; });
}

function makeResizable(boxEl, handleEl) {
  let resizing = false, startX, startY, startW, startH;
  const wrapEl = document.getElementById('videoWrap');

  handleEl.addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    resizing = true;
    handleEl.setPointerCapture(e.pointerId);
    const boxRect = boxEl.getBoundingClientRect();
    startX = e.clientX; startY = e.clientY;
    startW = boxRect.width; startH = boxRect.height;
  });
  handleEl.addEventListener('pointermove', (e) => {
    if (!resizing) return;
    e.stopPropagation();
    const wrapRect = wrapEl.getBoundingClientRect();
    const boxRect = boxEl.getBoundingClientRect();
    const maxW = wrapRect.right - boxRect.left;
    const maxH = wrapRect.bottom - boxRect.top;
    let newW = Math.max(40, Math.min(startW + (e.clientX - startX), maxW));
    let newH = Math.max(24, Math.min(startH + (e.clientY - startY), maxH));
    boxEl.style.width = newW + 'px';
    boxEl.style.height = newH + 'px';
  });
  handleEl.addEventListener('pointerup', () => { resizing = false; });
  handleEl.addEventListener('pointercancel', () => { resizing = false; });
}

const indexBoxEl = document.getElementById('indexBox');
const scoreBoxEl = document.getElementById('scoreBox');
makeDraggable(indexBoxEl);
makeResizable(indexBoxEl, indexBoxEl.querySelector('.resize-handle'));
makeDraggable(scoreBoxEl);
makeResizable(scoreBoxEl, scoreBoxEl.querySelector('.resize-handle'));

// Maps a crop-box's on-screen position/size (CSS px, relative to the video
// wrap) into true source-pixel coordinates on the captured frame, undoing
// the crop-and-scale that object-fit: cover applies to the displayed video.
function mapBoxToSource(boxEl) {
  const wrapRect = document.getElementById('videoWrap').getBoundingClientRect();
  const boxRect = boxEl.getBoundingClientRect();
  const vw = video.videoWidth, vh = video.videoHeight;
  const Wd = wrapRect.width, Hd = wrapRect.height;

  const scale = Math.max(Wd / vw, Hd / vh);
  const cropX = (vw * scale - Wd) / 2 / scale;
  const cropY = (vh * scale - Hd) / 2 / scale;

  const dispX = boxRect.left - wrapRect.left;
  const dispY = boxRect.top - wrapRect.top;

  const left = dispX / scale + cropX;
  const top = dispY / scale + cropY;
  const right = (dispX + boxRect.width) / scale + cropX;
  const bottom = (dispY + boxRect.height) / scale + cropY;

  return {
    left: Math.max(0, Math.round(left)),
    top: Math.max(0, Math.round(top)),
    right: Math.min(vw, Math.round(right)),
    bottom: Math.min(vh, Math.round(bottom))
  };
}

function cropFromFreeze(left, top, right, bottom) {
  const canvas = document.createElement('canvas');
  const sw = right - left, sh = bottom - top;
  const scale = sh < 60 ? 3 : 1.5; // upscale small crops for better OCR
  canvas.width = sw * scale; canvas.height = sh * scale;
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(freezeCanvas, left, top, sw, sh, 0, 0, canvas.width, canvas.height);
  return canvas;
}

let workerPromise = null;
async function getWorker() {
  if (!workerPromise) {
    workerPromise = (async () => await Tesseract.createWorker('eng'))();
  }
  return workerPromise;
}
async function ocrLine(canvas, whitelist) {
  const worker = await getWorker();
  const params = { tessedit_pageseg_mode: '7' };
  if (whitelist) params.tessedit_char_whitelist = whitelist;
  else params.tessedit_char_whitelist = ''; // no restriction — read whatever characters appear
  await worker.setParameters(params);
  const { data } = await worker.recognize(canvas);
  return { text: (data.text || '').trim(), confidence: data.confidence || 0 };
}

let lastReading = null;

async function captureCropped() {
  if (!video || video.readyState < 2) return;

  freezeCanvas.width = video.videoWidth;
  freezeCanvas.height = video.videoHeight;
  freezeCanvas.getContext('2d').drawImage(video, 0, 0);
  freezeCanvas.classList.remove('hidden');
  setScanStatus('Captured — reading crops...');

  try {
    const idxRect = mapBoxToSource(indexBoxEl);
    const scoreRect = mapBoxToSource(scoreBoxEl);

    const indexCanvas = cropFromFreeze(idxRect.left, idxRect.top, idxRect.right, idxRect.bottom);
    const scoreCanvas = cropFromFreeze(scoreRect.left, scoreRect.top, scoreRect.right, scoreRect.bottom);

    // show exactly what was cropped, so the human verifier can check it
    drawToView('indexCropView', indexCanvas);
    drawToView('scoreCropView', scoreCanvas);

    const indexResult = await ocrLine(indexCanvas);
    const scoreResult = await ocrLine(scoreCanvas);

    const indexNumber = indexResult.text;
    const score = scoreResult.text;
    const avgConf = (indexResult.confidence + scoreResult.confidence) / 2;

    let confLabel;
    if (avgConf >= 85 && indexNumber && score) confLabel = `High (${avgConf.toFixed(0)}%)`;
    else if (avgConf >= 65) confLabel = `Medium (${avgConf.toFixed(0)}%)`;
    else confLabel = `Low (${avgConf.toFixed(0)}%)`;

    lastReading = { confLabel };

    document.getElementById('indexNumber').value = indexNumber;
    document.getElementById('score').value = score;
    document.getElementById('confidenceText').textContent = confLabel;

    const flagEl = document.getElementById('confidenceFlag');
    flagEl.innerHTML = (confLabel.startsWith('Low') || !indexNumber || !score)
      ? '<div class="flag">⚠ Low confidence or a field came back empty — please check the detected crops below and correct as needed.</div>'
      : '';

    document.getElementById('resultCard').classList.remove('hidden');
    setScanStatus('Ready — adjust the boxes for the next booklet and capture again.');
  } catch (err) {
    setScanStatus('Reading failed: ' + err.message);
  }
}

function drawToView(canvasId, sourceCanvas) {
  const view = document.getElementById(canvasId);
  view.width = sourceCanvas.width;
  view.height = sourceCanvas.height;
  view.getContext('2d').drawImage(sourceCanvas, 0, 0);
}

function discardAndRescan() {
  document.getElementById('resultCard').classList.add('hidden');
  freezeCanvas.classList.add('hidden');
  setScanStatus('Position the boxes, then tap Capture.');
}

async function saveToSheet() {
  const scriptUrl = S.get('sheet_url');
  const indexNumber = document.getElementById('indexNumber').value.trim();
  const score = document.getElementById('score').value.trim();
  const confidence = lastReading ? lastReading.confLabel : '';
  const statusEl = document.getElementById('saveStatus');

  if (!indexNumber || !score) { statusEl.textContent = 'Enter both index number and score first.'; statusEl.className = 'status error'; return; }
  if (!scriptUrl) { statusEl.textContent = 'Google Sheet connection not set (see Settings).'; statusEl.className = 'status error'; return; }

  const saveBtn = document.getElementById('saveBtn');
  saveBtn.disabled = true;
  statusEl.textContent = 'Saving...'; statusEl.className = 'status';

  try {
    await fetch(scriptUrl, {
      method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ indexNumber, score, confidence, timestamp: new Date().toISOString() })
    });
    statusEl.textContent = 'Saved.'; statusEl.className = 'status ok';
    addToLog(indexNumber, score, confidence);
    document.getElementById('resultCard').classList.add('hidden');
    freezeCanvas.classList.add('hidden');
  } catch (err) {
    statusEl.textContent = 'Save failed: ' + err.message; statusEl.className = 'status error';
  } finally {
    saveBtn.disabled = false;
  }
}

function addToLog(indexNumber, score, confidence) {
  const logs = JSON.parse(localStorage.getItem('submission_log') || '[]');
  logs.unshift({ indexNumber, score, confidence, time: new Date().toLocaleTimeString() });
  localStorage.setItem('submission_log', JSON.stringify(logs.slice(0, 20)));
  renderLog();
}
function renderLog() {
  const logs = JSON.parse(localStorage.getItem('submission_log') || '[]');
  const el = document.getElementById('log');
  if (logs.length === 0) { el.textContent = 'No submissions yet.'; return; }
  el.innerHTML = logs.map(l => `<div class="log-row"><span>#${l.indexNumber} — ${l.score} (${l.confidence})</span><span>${l.time}</span></div>`).join('');
}
renderLog();
</script>
</body>
</html>
