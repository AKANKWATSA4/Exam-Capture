<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exam Mark Capture (Movable Crop Frames)</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
  :root {
    --accent: #185fa5; --bg: #f1efe8; --card: #ffffff; --border: #d3d1c7;
    --text: #2c2c2a; --muted: #5f5e5a; --danger: #a32d2d; --success: #3b6d11;
  }
  * { box-sizing: border-box; touch-action: none; }
  body { touch-action: auto; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); margin: 0; padding: 16px;
    max-width: 480px; margin: 0 auto;
  }
  h1 { font-size: 18px; font-weight: 600; margin: 8px 0 4px; }
  p.sub { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .badge { display: inline-block; background: #e4efe0; color: var(--success); font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 12px; margin-bottom: 12px; }
  .badge.scan { background: #dbe8f5; color: var(--accent); }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  input[type="text"], input[type="number"] { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; margin-bottom: 12px; }
  button.secondary { width: 100%; padding: 12px; background: transparent; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; cursor: pointer; color: var(--text); margin-top: 8px; }
  button.save { width: 100%; padding: 14px; background: var(--success); color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 8px; }
  button.start { width: 100%; padding: 16px; background: var(--accent); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .video-wrap { position: relative; width: 100%; border-radius: 10px; overflow: hidden; background: #000; user-select: none; }
  video, #freezeCanvas { width: 100%; display: block; pointer-events: none; }
  #freezeCanvas { position: absolute; top: 0; left: 0; }
  .scan-status { text-align: center; font-size: 12px; color: white; background: rgba(0,0,0,0.55); position: absolute; bottom: 8px; left: 8px; right: 8px; padding: 6px; border-radius: 8px; pointer-events: none; }
  .crop-box {
    position: absolute; border: 2px solid #ff9500; background: rgba(255,149,0,0.12);
    cursor: move; box-sizing: border-box;
  }
  .crop-box.score { border-color: #34c759; background: rgba(52,199,89,0.12); }
  .crop-label {
    position: absolute; top: -20px; left: 0; font-size: 11px; color: white;
    background: rgba(0,0,0,0.6); padding: 2px 6px; border-radius: 4px; pointer-events: none;
  }
  .resize-handle {
    position: absolute; right: -8px; bottom: -8px; width: 20px; height: 20px;
    background: #ff9500; border: 2px solid white; border-radius: 50%; cursor: se-resize;
  }
  .crop-box.score .resize-handle { background: #34c759; }
  .status { font-size: 13px; margin: 8px 0; min-height: 18px; }
  .status.error { color: var(--danger); }
  .status.ok { color: var(--success); }
  .flag { background: #faeeda; color: #854f0b; font-size: 12px; padding: 6px 10px; border-radius: 6px; margin-bottom: 10px; }
  details summary { cursor: pointer; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .log { font-size: 12px; color: var(--muted); }
  .log-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--border); }
  .hidden { display: none; }
  .detected-crop { display: block; max-width: 100%; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 8px; background: #fff; }
  .crop-preview-label { font-size: 11px; color: var(--muted); margin: 4px 0 2px; }
</style>
</head>
<body>

  <h1>Exam mark capture</h1>
  <p class="sub">Drag the orange box over the index number and the green box over the score. They'll stay put for next time.</p>

  <div class="card" id="scanCard">
    <div class="badge scan">Live scanning</div>
    <button class="start" id="startBtn" onclick="startScanning()">▶ Start scanning</button>
    <div class="video-wrap hidden" id="videoWrap">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="freezeCanvas" class="hidden"></canvas>

      <div class="crop-box index" id="indexBox">
        <div class="crop-label">Index number</div>
        <div class="resize-handle" data-box="index"></div>
      </div>
      <div class="crop-box score" id="scoreBox">
        <div class="crop-label">Score</div>
        <div class="resize-handle" data-box="score"></div>
      </div>

      <div class="scan-status" id="scanStatus">Position the boxes, then tap Capture</div>
    </div>
    <button class="start hidden" id="captureBtn" onclick="captureAndRead()" style="margin-top:10px;">📸 Capture</button>
    <button class="secondary hidden" id="stopBtn" onclick="stopScanning()">Stop scanning</button>
  </div>

  <div class="card hidden" id="resultCard">
    <div class="badge">Verify before saving</div>
    <div id="confidenceFlag"></div>

    <div class="crop-preview-label">Cropped as index number:</div>
    <canvas id="indexCropView" class="detected-crop"></canvas>
    <label for="indexNumber">Index number</label>
    <input type="text" id="indexNumber" placeholder="e.g. 1234/2026">

    <div class="crop-preview-label">Cropped as score:</div>
    <canvas id="scoreCropView" class="detected-crop"></canvas>
    <label for="score">Score</label>
    <input type="number" id="score">

    <label style="margin-top:4px;">Confidence: <span id="confidenceText" style="color:var(--text);font-weight:600;"></span></label>
    <button class="save" id="saveBtn" onclick="saveToSheet()">Save & scan next</button>
    <button class="secondary" onclick="discardAndRescan()">Discard, adjust & rescan</button>
    <div id="saveStatus" class="status"></div>
  </div>

  <details>
    <summary>Settings</summary>
    <div class="card">
      <label for="scriptUrl">Google Apps Script web app URL</label>
      <input type="text" id="scriptUrl" placeholder="https://script.google.com/macros/s/.../exec">
      <button class="secondary" onclick="saveSettings()">Save settings</button>
      <button class="secondary" onclick="resetBoxPositions()">Reset box positions to default</button>
      <div id="settingsStatus" class="status"></div>
    </div>
  </details>

  <div class="card">
    <label>Recent submissions (this device)</label>
    <div class="log" id="log">No submissions yet.</div>
  </div>

<script>
const S = { get: k => localStorage.getItem(k) || '', set: (k, v) => localStorage.setItem(k, v) };
document.getElementById('scriptUrl').value = S.get('sheet_url');
function saveSettings() {
  S.set('sheet_url', document.getElementById('scriptUrl').value.trim());
  const el = document.getElementById('settingsStatus');
  el.textContent = 'Settings saved.'; el.className = 'status ok';
}

let stream = null;
let video, freezeCanvas, videoWrap;

// ---- Crop box positions, stored as percentages of the video container ----
const DEFAULT_BOXES = {
  index: { left: 8,  top: 16, width: 45, height: 10 },
  score: { left: 8,  top: 34, width: 25, height: 10 },
};
let boxes = loadBoxes();

function loadBoxes() {
  const saved = JSON.parse(localStorage.getItem('crop_boxes') || 'null');
  return saved || JSON.parse(JSON.stringify(DEFAULT_BOXES));
}
function saveBoxes() {
  localStorage.setItem('crop_boxes', JSON.stringify(boxes));
}
function resetBoxPositions() {
  boxes = JSON.parse(JSON.stringify(DEFAULT_BOXES));
  saveBoxes();
  renderBoxes();
  const el = document.getElementById('settingsStatus');
  el.textContent = 'Box positions reset.'; el.className = 'status ok';
}

function renderBoxes() {
  const w = videoWrap.clientWidth, h = videoWrap.clientHeight;
  ['index', 'score'].forEach(key => {
    const el = document.getElementById(key + 'Box');
    const b = boxes[key];
    el.style.left = (b.left/100*w) + 'px';
    el.style.top = (b.top/100*h) + 'px';
    el.style.width = (b.width/100*w) + 'px';
    el.style.height = (b.height/100*h) + 'px';
  });
}

// ---- Drag & resize handling (pointer events cover mouse + touch) ----
function setupBoxInteraction() {
  ['index', 'score'].forEach(key => {
    const el = document.getElementById(key + 'Box');
    const handle = el.querySelector('.resize-handle');

    el.addEventListener('pointerdown', (e) => {
      if (e.target === handle) return; // handled separately below
      e.preventDefault();
      const w = videoWrap.clientWidth, h = videoWrap.clientHeight;
      const startX = e.clientX, startY = e.clientY;
      const startBox = { ...boxes[key] };

      function onMove(ev) {
        const dxPct = (ev.clientX - startX) / w * 100;
        const dyPct = (ev.clientY - startY) / h * 100;
        boxes[key].left = clamp(startBox.left + dxPct, 0, 100 - boxes[key].width);
        boxes[key].top = clamp(startBox.top + dyPct, 0, 100 - boxes[key].height);
        renderBoxes();
      }
      function onUp() {
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
        saveBoxes();
      }
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
    });

    handle.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      e.stopPropagation();
      const w = videoWrap.clientWidth, h = videoWrap.clientHeight;
      const startX = e.clientX, startY = e.clientY;
      const startBox = { ...boxes[key] };

      function onMove(ev) {
        const dwPct = (ev.clientX - startX) / w * 100;
        const dhPct = (ev.clientY - startY) / h * 100;
        boxes[key].width = clamp(startBox.width + dwPct, 6, 100 - boxes[key].left);
        boxes[key].height = clamp(startBox.height + dhPct, 5, 100 - boxes[key].top);
        renderBoxes();
      }
      function onUp() {
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
        saveBoxes();
      }
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
    });
  });
}
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

async function startScanning() {
  document.getElementById('startBtn').classList.add('hidden');
  document.getElementById('videoWrap').classList.remove('hidden');
  document.getElementById('captureBtn').classList.remove('hidden');
  document.getElementById('stopBtn').classList.remove('hidden');
  document.getElementById('resultCard').classList.add('hidden');

  video = document.getElementById('video');
  freezeCanvas = document.getElementById('freezeCanvas');
  videoWrap = document.getElementById('videoWrap');

  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }
    });
    video.srcObject = stream;
    await video.play();
    renderBoxes();
    setupBoxInteraction();
    window.addEventListener('resize', renderBoxes);
    setScanStatus('Position the boxes, then tap Capture');
  } catch (err) {
    setScanStatus('Camera access failed: ' + err.message);
  }
}

function stopScanning() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  document.getElementById('startBtn').classList.remove('hidden');
  document.getElementById('videoWrap').classList.add('hidden');
  document.getElementById('captureBtn').classList.add('hidden');
  document.getElementById('stopBtn').classList.add('hidden');
}

function setScanStatus(text) {
  document.getElementById('scanStatus').textContent = text;
}

async function captureAndRead() {
  setScanStatus('Captured — reading...');

  freezeCanvas.width = video.videoWidth;
  freezeCanvas.height = video.videoHeight;
  freezeCanvas.getContext('2d').drawImage(video, 0, 0);
  freezeCanvas.classList.remove('hidden');

  await readAndShow();
}

// ---- Crop exactly what the user positioned, then lightly trim inner whitespace ----
function preprocess(canvas) {
  const ctx = canvas.getContext('2d');
  const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const d = imgData.data;
  for (let i = 0; i < d.length; i += 4) {
    const gray = 0.3*d[i] + 0.59*d[i+1] + 0.11*d[i+2];
    const v = gray < 150 ? 0 : 255;
    d[i] = d[i+1] = d[i+2] = v;
  }
  ctx.putImageData(imgData, 0, 0);
  return canvas;
}

function cropFromFreeze(box) {
  const left = box.left/100 * freezeCanvas.width;
  const top = box.top/100 * freezeCanvas.height;
  const sw = box.width/100 * freezeCanvas.width;
  const sh = box.height/100 * freezeCanvas.height;
  const scale = sh < 80 ? 3 : 1.5;
  const canvas = document.createElement('canvas');
  canvas.width = sw * scale; canvas.height = sh * scale;
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(freezeCanvas, left, top, sw, sh, 0, 0, canvas.width, canvas.height);
  return canvas;
}

let workerPromise = null;
async function getWorker() {
  if (!workerPromise) workerPromise = (async () => await Tesseract.createWorker('eng'))();
  return workerPromise;
}
async function ocrLine(canvas, whitelist) {
  const worker = await getWorker();
  await worker.setParameters({ tessedit_char_whitelist: whitelist, tessedit_pageseg_mode: '7' });
  const { data } = await worker.recognize(canvas);
  return { text: (data.text || '').trim(), confidence: data.confidence || 0 };
}

let lastReading = null;

async function readAndShow() {
  try {
    const indexCanvas = preprocess(cropFromFreeze(boxes.index));
    const scoreCanvas = preprocess(cropFromFreeze(boxes.score));

    drawToView('indexCropView', indexCanvas);
    drawToView('scoreCropView', scoreCanvas);

    const indexResult = await ocrLine(indexCanvas, '0123456789/');
    const scoreResult = await ocrLine(scoreCanvas, '0123456789');

    const indexNumber = indexResult.text.replace(/[^0-9/]/g, '');
    const score = scoreResult.text.replace(/\D/g, '');
    const avgConf = (indexResult.confidence + scoreResult.confidence) / 2;

    let confLabel;
    if (avgConf >= 85 && indexNumber && score) confLabel = `High (${avgConf.toFixed(0)}%)`;
    else if (avgConf >= 65) confLabel = `Medium (${avgConf.toFixed(0)}%)`;
    else confLabel = `Low (${avgConf.toFixed(0)}%)`;

    lastReading = { confLabel };

    document.getElementById('indexNumber').value = indexNumber;
    document.getElementById('score').value = score;
    document.getElementById('confidenceText').textContent = confLabel;

    const flagEl = document.getElementById('confidenceFlag');
    flagEl.innerHTML = (confLabel.startsWith('Low') || !indexNumber || !score)
      ? '<div class="flag">⚠ Low confidence or a field came back empty — check the crops below and correct as needed.</div>'
      : '';

    document.getElementById('resultCard').classList.remove('hidden');
    setScanStatus('Ready for next booklet — tap Capture when ready.');
  } catch (err) {
    setScanStatus('Reading failed: ' + err.message);
  }
}

function drawToView(canvasId, sourceCanvas) {
  const view = document.getElementById(canvasId);
  view.width = sourceCanvas.width;
  view.height = sourceCanvas.height;
  view.getContext('2d').drawImage(sourceCanvas, 0, 0);
}

function discardAndRescan() {
  document.getElementById('resultCard').classList.add('hidden');
  freezeCanvas.classList.add('hidden');
  setScanStatus('Position the boxes, then tap Capture');
}

async function saveToSheet() {
  const scriptUrl = S.get('sheet_url');
  const indexNumber = document.getElementById('indexNumber').value.trim();
  const score = document.getElementById('score').value.trim();
  const confidence = lastReading ? lastReading.confLabel : '';
  const statusEl = document.getElementById('saveStatus');

  if (!indexNumber || !score) { statusEl.textContent = 'Enter both index number and score first.'; statusEl.className = 'status error'; return; }
  if (!scriptUrl) { statusEl.textContent = 'Google Sheet connection not set (see Settings).'; statusEl.className = 'status error'; return; }

  const saveBtn = document.getElementById('saveBtn');
  saveBtn.disabled = true;
  statusEl.textContent = 'Saving...'; statusEl.className = 'status';

  try {
    await fetch(scriptUrl, {
      method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ indexNumber, score, confidence, timestamp: new Date().toISOString() })
    });
    statusEl.textContent = 'Saved.'; statusEl.className = 'status ok';
    addToLog(indexNumber, score, confidence);
    document.getElementById('resultCard').classList.add('hidden');
    freezeCanvas.classList.add('hidden');
  } catch (err) {
    statusEl.textContent = 'Save failed: ' + err.message; statusEl.className = 'status error';
  } finally {
    saveBtn.disabled = false;
  }
}

function addToLog(indexNumber, score, confidence) {
  const logs = JSON.parse(localStorage.getItem('submission_log') || '[]');
  logs.unshift({ indexNumber, score, confidence, time: new Date().toLocaleTimeString() });
  localStorage.setItem('submission_log', JSON.stringify(logs.slice(0, 20)));
  renderLog();
}
function renderLog() {
  const logs = JSON.parse(localStorage.getItem('submission_log') || '[]');
  const el = document.getElementById('log');
  if (logs.length === 0) { el.textContent = 'No submissions yet.'; return; }
  el.innerHTML = logs.map(l => `<div class="log-row"><span>#${l.indexNumber} — ${l.score} (${l.confidence})</span><span>${l.time}</span></div>`).join('');
}
renderLog();
</script>
</body>
</html>
